<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Effect</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" />

  <!-- Bootstrap Icons CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.3/font/bootstrap-icons.min.css" />

  <!-- Bootstrap Colorpicker CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-colorpicker/3.2.0/css/bootstrap-colorpicker.min.css">

  <style>
    /* Make the canvas fill the entire screen */
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden; /* Prevent scrolling when the canvas is active */
      height: 100%;
      background-color: black;
      background-image: linear-gradient(rgba(0, 0, 0, 0.9), rgba(26, 26, 26, 0.9));
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center center;
    }

    /* Color Picker and Button centered */
    .color-picker-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      color: white;
      text-align: center;
    }

    canvas {
      display: none; /* Initially hidden until triggered */
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000; /* Make sure the canvas is on top of other content */
    }

    /* GitHub Icon */
    .github-icon {
      position: absolute;
      top: 10px;
      right: 15px;
      color: white;
      z-index: 999;
      font-size: 24px;
      text-decoration: none;
    }

    .github-icon:hover {
      color: #ddd;
    }

    /* Footer */
    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 10px 0;
      color: white;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    footer a {
      color: white;
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* Spinner inside button */
    .spinner-border {
      display: none;
      width: 1rem;
      height: 1rem;
    }

    /* Initially hide the download icon */
    #download-icon {
      display: none_;
    }
  </style>
</head>
<body>

  <!-- GitHub Icon using Bootstrap Icons -->
  <a href="https://github.com/ralphdp/Matrix-Code-Wall-Effect" class="github-icon">
    <i class="bi bi-github"></i>
  </a>

  <!-- Color Picker Input Group and Start Button Centered -->
  <div class="color-picker-container shadow">
    <div class="input-group mb-4">
      <span class="input-group-text">Matrix Color:</span>
      <input id="matrix-color" type="text" value="#00FF00" class="form-control" style="height:38px;"/>
      <button id="start-matrix" class="btn btn-primary bg-gradient start-button"><i class="bi bi-play-fill"></i></button>
    </div>
  </div>

  <canvas id="matrix-canvas"></canvas>

  <!-- Footer -->
  <footer>
    <p class="text-secondary"><a href="https://rdepaz.com" target="_blank">rdepaz.com</a></p>
  </footer>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>

  <!-- Bootstrap Colorpicker JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-colorpicker/3.2.0/js/bootstrap-colorpicker.min.js"></script>

  <script>
    let animationPlayed = false;
    let gif;
    const canvasMatrix = document.getElementById('matrix-canvas');
    const ctxMatrix = canvasMatrix.getContext('2d', { willReadFrequently: true });

    $(function () {
      $('#matrix-color').colorpicker({
        format: 'hex',
      });

      $('#matrix-color').on('colorpickerChange', function (event) {
        const newColor = event.color.toString();
        updateMatrixColor(newColor);
      });

      const fontSize = 16;
      let columns;
      let drops;
      let matrixColor = '#0F0';
      let matrixEffectInterval;

      function resizeCanvas() {
        canvasMatrix.width = window.innerWidth;
        canvasMatrix.height = window.innerHeight;
        resetDrops();
      }

      resizeCanvas();

      // Expanded sushi recipes and ingredients (in Katakana with translations for context)
      const recipes = [
        'サーモン', 'ご飯', '酢', '砂糖', '塩 少々', 'のり', '醤油で味付け', 'わさびを添えて', '巻き寿司', 'にぎり寿司', '手巻き寿司',
        'エビ', 'アボカド', 'キュウリ', 'ツナ缶 1缶', 'ごま油', '薄く切った刺身', '酢飯を作る', '具材を巻く', '細く切った海苔',
        '酢飯を広げる', '刺身をのせる', 'マグロ', 'ハマチ', 'イクラ', 'カニカマ', 'ウナギ', 'サバ', 'タマゴ焼き', 'ネギトロ',
        'シソ葉', 'とびっこ', 'ゴマをまぶす', 'スダチを添える', '味噌をぬる', 'ポン酢で味付け', 'シャリ', 'サーモンロール',
        'タコの刺身', '細巻き', '鉄火巻', 'えんがわ', 'カツオ'
      ];

      // Additional half-width kana, Latin letters, and numerals for variation
      const randomChars = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾜｦﾝABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+[]{}|;:",.<>?/`~';

      function resetDrops() {
        columns = Math.floor(canvasMatrix.width / fontSize);
        drops = Array(columns).fill(0);
        ctxMatrix.clearRect(0, 0, canvasMatrix.width, canvasMatrix.height);
      }

      function updateMatrixColor(newColor) {
        matrixColor = newColor;
      }

      function draw() {
        ctxMatrix.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctxMatrix.fillRect(0, 0, canvasMatrix.width, canvasMatrix.height);
        ctxMatrix.font = `${fontSize}px monospace`;

        for (let i = 0; i < drops.length; i++) {
          // Randomly decide whether to use a recipe character or a random half-width kana/Latin/numeral character
          let text;
          if (Math.random() > 0.2) {  // 80% chance to use recipe character
            const phrase = recipes[Math.floor(Math.random() * recipes.length)];
            const chars = phrase.split('');
            const charIndex = drops[i] % chars.length;
            text = chars[charIndex];
          } else {  // 20% chance to use a random half-width kana, Latin letter, or numeral
            text = randomChars.charAt(Math.floor(Math.random() * randomChars.length));
          }

          ctxMatrix.fillStyle = matrixColor;
          ctxMatrix.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvasMatrix.height && Math.random() > 0.975) {
            drops[i] = 0;
          }

          drops[i]++;
        }
      }

      function startMatrixEffect() {
        resetDrops();
        if (!matrixEffectInterval) {
          matrixEffectInterval = setInterval(draw, 33);
        }
        $('.color-picker-container').hide();
      }

      function stopMatrixEffect() {
        if (matrixEffectInterval) {
          clearInterval(matrixEffectInterval);
          matrixEffectInterval = null;
        }
        ctxMatrix.clearRect(0, 0, canvasMatrix.width, canvasMatrix.height);
        canvasMatrix.style.display = 'none';
        $('.color-picker-container').show();
        togglePageScrolling(true);
      }

      function openMatrixEffect() {
        window.scrollTo(0, 0);
        canvasMatrix.style.display = 'block';
        startMatrixEffect();
        togglePageScrolling(false);
      }

      function togglePageScrolling(enable) {
        document.body.style.overflow = enable ? 'auto' : 'hidden';
      }

      canvasMatrix.addEventListener('click', () => {
        stopMatrixEffect();
      });

      document.getElementById('start-matrix').addEventListener('click', function() {
        openMatrixEffect();
      });

      window.addEventListener('resize', () => {
        resizeCanvas();
        resetDrops();
      });
    });
  </script>

</body>
</html>
